name: Deploy openGym PWA to Pages

# Manual-only. This workflow is NOT needed if Pages is set to
# "Deploy from a branch" (branch: claude/new-session-wv93yg, folder: / (root)),
# which serves the committed site directly.
#
# It is only useful if Pages Source is set to "GitHub Actions" instead.
# Either way, Pages must be switched on once by a repo admin first — the
# Actions token here is not permitted to create the Pages site itself.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the built site — not the repo scaffolding.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='README.md' \
            --exclude='FINISH-ON-YOUR-MAC.sh' \
            ./ _site/
          ls -la _site

      # No enablement: true — creating the Pages site requires repo-admin
      # rights the Actions token does not have, and it fails regardless of
      # repository visibility. Pages must be switched on by hand once.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
